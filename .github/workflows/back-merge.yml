name: BACK MERGE main into dev

on:
  workflow_run:
    workflows: ['RELEASE PROD']
    types: [completed]
  workflow_dispatch:

jobs:
  back-merge:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Activate the merge=ours driver so .gitattributes rules on
          # package.json and CHANGELOG.md auto-resolve in CI.
          git config merge.ours.driver true

      - name: Merge main into dev
        run: |
          git fetch origin main
          git merge origin/main --no-ff -m "chore: back-merge from main after release"
          git push origin dev
